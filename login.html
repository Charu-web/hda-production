<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – HDA Production</title>
  <meta name="description" content="Login to access your HDA Production account. Currently a placeholder page.">
  <link rel="stylesheet" href="css/luxury-editorial.css">
  <link rel="stylesheet" href="css/custom.css">
  <link rel="icon" href="assets/images/logo.png" type="image/png">
</head>
<body>
  <header class="hda-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo">
        <img src="assets/images/logo.png" alt="HDA Production logo" class="logo-image" style="height: 40px;" />
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
        <li><a href="services.html" class="nav-link">Services</a></li>
        <li><a href="portfolio.html" class="nav-link">Portfolio</a></li>
        <li><a href="gallery.html" class="nav-link">Gallery</a></li>
        <li><a href="registration.html" class="nav-link">Registration</a></li>
        <li><a href="login.html" class="nav-link active">Login</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>
      <div style="display: flex; align-items: center; gap: 1rem;">
        <a href="registration.html" class="btn-gold"><i class="fa-solid fa-user-plus"></i> REGISTER NOW</a>
        <button class="mobile-toggle" aria-label="Toggle Navigation Menu"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </header>

  <main class="hda-page-view" style="padding: 4rem 2rem; background: var(--color-bg-dark); color: var(--color-text);">
    <section class="section-luxury" style="max-width: 500px; margin: 0 auto;">
      <h1 class="hero-title text-gradient-gold" style="text-align:center;">Login</h1>
      <p style="text-align:center; margin-top:1rem;">This is a placeholder login page. No backend is connected yet.</p>
      <form id="loginForm" class="login-form" style="margin-top:2rem;">
        <div class="form-group">
          <label for="loginEmail">Email Address *</label>
          <input type="email" id="loginEmail" name="loginEmail" required />
        </div>
        <div class="form-group">
          <label for="loginPassword">Password *</label>
          <input type="password" id="loginPassword" name="loginPassword" required minlength="8" />
        </div>
        <button type="submit" class="btn-gold" id="loginBtn" disabled>LOGIN</button>
        <div id="loginMessage" style="margin-top:1rem;"></div>
      </form>
    </section>
  </main>

  <footer class="footer-editorial">
    <!-- Footer content same as index (omitted for brevity) -->
  </footer>

  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
